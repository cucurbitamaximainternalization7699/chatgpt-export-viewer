name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.8', '3.12', '3.13']
        exclude:
          - os: macos-latest
            python: '3.8'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Pillow for the demo generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Run edge-case tests
        run: python tests/test_exports.py

      - name: Build the demo export end to end
        run: |
          python tests/make_demo_export.py demo-export.zip
          python build_site.py demo-export.zip demo-site

      - name: Check the generated site
        shell: python {0}
        run: |
          import os
          import re

          pages = []
          for root, _, files in os.walk(os.path.join('demo-site', 'site', 'chats')):
              pages += [os.path.join(root, name) for name in files if name.endswith('.html')]
          index = os.path.join('demo-site', 'site', 'index.html')
          assert os.path.exists(index), 'index.html is missing'
          assert len(pages) >= 20, 'expected at least 20 pages, got %d' % len(pages)

          with open(index, encoding='utf-8') as fh:
              home = fh.read()
          assert 'conversations' in home
          missing = re.search(r'(\d+) of (\d+) files missing', home)
          assert missing, 'the missing-files line disappeared from the header'
          assert int(missing.group(1)) == 1, 'demo should miss exactly one file, got ' + missing.group(0)

          images = 0
          for page in pages:
              with open(page, encoding='utf-8') as fh:
                  images += len(re.findall(r'<img [^>]*src="\.\./', fh.read()))
          assert images >= 5, 'expected at least 5 images, got %d' % images
          print('pages: %d, images: %d' % (len(pages), images))
