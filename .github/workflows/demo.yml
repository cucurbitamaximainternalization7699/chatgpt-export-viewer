name: demo

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow for the demo generator
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate a fake export and build the site
        env:
          SITE_URL: https://gusarovv.github.io/chatgpt-export-viewer/
        run: |
          python tests/make_demo_export.py demo-export.zip
          python build_site.py demo-export.zip demo-build --seo "$SITE_URL"

      - name: Add the landing page and its screenshots
        run: |
          cp docs/landing.html demo-build/index.html
          mkdir -p demo-build/shots
          cp docs/screenshot-search-light.png docs/screenshot-search-dark.png demo-build/shots/
          cp docs/screenshot-conversation-light.png docs/screenshot-conversation-dark.png demo-build/shots/

      - name: Render the Open Graph image
        run: |
          python - <<'PY'
          from PIL import Image

          shot = Image.open('docs/screenshot-index-dark.png').convert('RGB')
          width = 1200
          scaled = shot.resize((width, round(shot.height * width / shot.width)), Image.LANCZOS)
          scaled.crop((0, 0, width, 630)).save('demo-build/og.png', optimize=True)
          PY

      - name: Write robots.txt and sitemap.xml
        env:
          SITE_URL: https://gusarovv.github.io/chatgpt-export-viewer
        run: |
          printf '%s\n' \
            'User-agent: *' \
            'Allow: /' \
            "Sitemap: $SITE_URL/sitemap.xml" \
            > demo-build/robots.txt
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' \
            "  <url><loc>$SITE_URL/</loc><priority>1.0</priority></url>" \
            "  <url><loc>$SITE_URL/site/index.html</loc><priority>0.8</priority></url>" \
            '</urlset>' \
            > demo-build/sitemap.xml

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo-build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
