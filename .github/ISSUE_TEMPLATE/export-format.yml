name: Export format problem
description: The tool fails on your export, or shows fewer conversations than you expect
labels: [format]
body:
  - type: markdown
    attributes:
      value: |
        OpenAI changes the export format without announcing it. If something looks wrong,
        the details below usually explain why. **Do not attach your export**: it contains
        your entire history. The file listing and a single anonymised conversation are enough.

  - type: input
    id: date
    attributes:
      label: When did you request the export
      placeholder: 2026-08-20
    validations:
      required: true

  - type: dropdown
    id: plan
    attributes:
      label: Which plan
      options: [Free, Plus, Pro, Team or Business, Enterprise, Edu, "Privacy Portal request"]
    validations:
      required: true

  - type: textarea
    id: listing
    attributes:
      label: What is inside the archive
      description: Run `unzip -l your-export.zip | head -40` and paste the output.
      render: text
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What the tool printed
      description: Copy the console output, including the numbers at the end.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: 2800 conversations, but only 100 pages were generated
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
